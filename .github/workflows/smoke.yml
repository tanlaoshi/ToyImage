# Smoke boot (PR-CI-2：lwIP + ubuntu-24.04；Kernel 推送另由 Kernel build.yml smoke job 覆盖)
name: smoke

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Scripts/run-split.sh'
      - 'Scripts/toy-qemu-lib.sh'
      - 'Scripts/smoke-boot.sh'
      - 'Scripts/prepare-rootfs.sh'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Scripts/run-split.sh'
      - 'Scripts/toy-qemu-lib.sh'
      - 'Scripts/smoke-boot.sh'
      - 'Scripts/prepare-rootfs.sh'
      - '.github/workflows/smoke.yml'

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ToyImage
        uses: actions/checkout@v4
        with:
          path: ToyImage

      - name: Checkout ToyKernel
        uses: actions/checkout@v4
        with:
          repository: tanlaoshi/ToyKernel
          path: ToyKernel

      - name: Install QEMU + OVMF + build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 ovmf build-essential gcc make

      - name: Clone lwIP
        run: |
          git clone --depth 1 --branch STABLE-2_2_0_RELEASE \
            https://github.com/lwip-tcpip/lwip.git ToyKernel/ThirdParty/lwip

      - name: Build kernel into ToyImage
        run: |
          cd ToyKernel
          ./build.sh x86_64
          test -f ../ToyImage/RootFs/X64/Kernel.elf

      - name: Smoke boot (TOY_SMP=1)
        run: |
          cd ToyImage
          TOY_SMP=1 SMOKE_TIMEOUT=120 ./Scripts/smoke-boot.sh
